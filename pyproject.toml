[tool.ruff]
line-length = 110
target-version = "py312"  # misma versión que CI y Docker
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # alpaca-py importa websockets.legacy (aviso de terceros, no de este código)
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
