name: Backtest y optimización programados

on:
  schedule:
    - cron: "0 6 * * 1-5"   # días laborables a las 06:00 UTC
  workflow_dispatch:
    inputs:
      trials:
        description: "Número de trials de Optuna"
        default: "100"
      config_json:
        description: "Config de producción a optimizar (JSON con symbols/timeframe/strategy_params; vacío = variable OPTIMIZER_CONFIG_JSON o valores por defecto)"
        default: ""

permissions:
  contents: read

concurrency:
  group: backtest-scheduled
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      SETTINGS_DB_PATH: ${{ github.workspace }}/artifacts/settings.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Comprobar credenciales de Alpaca
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::error::Faltan los secrets APCA_API_KEY_ID / APCA_API_SECRET_KEY en el repositorio"
            exit 1
          fi
      - run: pip install -r requirements.txt
      - run: mkdir -p artifacts
      - name: Cargar la configuración de producción (si se proporciona)
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json || vars.OPTIMIZER_CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            python -c 'import json, os; from config.settings import SettingsStore; SettingsStore().update(json.loads(os.environ["CONFIG_JSON"]))'
          else
            echo "::warning::Sin config de producción: se optimizan los parámetros por defecto"
          fi
      - name: Ejecutar optimización (no aplica en producción, solo informa)
        env:
          TRIALS: ${{ github.event.inputs.trials || '100' }}
        # Resultado -> artifacts/optimization.json; logs JSON -> stderr (log del job) y artifacts/optimizer.log
        run: |
          set -o pipefail
          python -m optimization.optimizer --trials "$TRIALS" --no-apply \
            --output artifacts/optimization.json 2> >(tee artifacts/optimizer.log >&2)
      - name: Validar el JSON y resumir
        if: always()
        run: |
          jq -e '.results | type == "array"' artifacts/optimization.json
          {
            echo "### Resultados de la optimización"
            echo "| Símbolo | Mejora OOS | Aplicable | Sharpe OOS | Retorno OOS | Trades OOS | Motivo de rechazo |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.results[] | "| \(.symbol) | \(.improved) | \(.applicable) | \(.best_oos.sharpe * 100 | round / 100) | \(.best_oos.total_return * 10000 | round / 100) % | \(.best_oos.num_trades) | \((.rejected_reason // []) | join("; ")) |"' artifacts/optimization.json
            jq -r '.errors[] | "| \(.symbol) | error: \(.error) | | | | | |"' artifacts/optimization.json
            jq -r '"Criterios: " + (.criteria // {} | tostring)' artifacts/optimization.json
            echo
            echo 'Para aplicar el ganador (solo los aplicables; se reevalúan los criterios): descarga el artefacto y ejecuta `python -m optimization.optimizer --apply-report optimization.json` junto al bot.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-results
          path: artifacts/
          retention-days: 30
